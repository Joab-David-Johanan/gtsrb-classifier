data:
  root: data/gtsrb
  image_size: 224
  num_classes: 43
  num_workers: 4

model:
  backbone: resnet50
  pretrained: true
  dropout: 0.3

training:
  epochs: 30
  batch_size: 64
  learning_rate: 1e-3
  weight_decay: 1e-4
  mixed_precision: true
  grad_clip: 1.0
  seed: 42

paths:
  checkpoints: checkpoints/
  logs: logs/
